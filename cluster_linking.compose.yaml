            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,DOCKER:PLAINTEXT,EXTERNAL:PLAINTEXT
            KAFKA_ADVERTISED_LISTENERS: DOCKER://kafka-A3:9092, EXTERNAL://localhost:39092
            KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
            KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
            KAFKA_JMX_PORT: 10003
            KAFKA_JMX_HOSTNAME: localhost
            KAFKA_BROKER_RACK: rack-0
            KAFKA_METRIC_REPORTERS: io.confluent.metrics.reporter.ConfluentMetricsReporter
            KAFKA_NODE_ID: 3
            CLUSTER_ID: Nk018hRAQFytWskYqtQduw
            KAFKA_CONTROLLER_QUORUM_VOTERS: 9991@controller-A1:19093
            KAFKA_PROCESS_ROLES: broker
            KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
            KAFKA_CONFLUENT_METRICS_REPORTER_BOOTSTRAP_SERVERS: kafka-A1:9092,kafka-A2:9092,kafka-A3:9092
            KAFKA_CONFLUENT_BALANCER_ENABLE: false
            # KAFKA_GROUP_COORDINATOR_REBALANCE_PROTOCOLS: classic,consumer
            # KAFKA_TRANSACTION_PARTITION_VERIFICATION_ENABLE: false
        cap_add:
            - NET_ADMIN
        ports:
            - "39092:39092"
            - "10003:10003"

    schema-registry-A1:
        image: confluentinc/cp-schema-registry:7.8.1
        hostname: schema-registry-A1
        container_name: schema-registry-A1
        healthcheck:
            test: curl -fail --silent http://schema-registry-A1:8081/subjects --output /dev/null || exit 1
            interval: 30s
            retries: 10
            start_period: 20s
        depends_on:
            kafka-A1:
                condition: service_healthy
            kafka-A2:
                condition: service_healthy
            kafka-A3:
                condition: service_healthy
        environment:
            SCHEMA_REGISTRY_HOST_NAME: schema-registry-A1
            SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka-A1:9092,kafka-A2:9092,kafka-A3:9092
            SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
            SCHEMA_REGISTRY_RESOURCE_EXTENSION_CLASS: io.confluent.schema.exporter.SchemaExporterResourceExtension
            SCHEMA_REGISTRY_KAFKASTORE_UPDATE_HANDLERS: io.confluent.schema.exporter.storage.SchemaExporterUpdateHandler
            SCHEMA_REGISTRY_PASSWORD_ENCODER_SECRET: changeme
        ports:
            - "8081:8081"

