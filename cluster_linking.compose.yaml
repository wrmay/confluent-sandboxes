services:
    controller-A1:
        image: confluentinc/cp-server:7.8.1
        hostname: controller-A1
        container_name: controller-A1
        volumes:
            - data-controller-A1:/var/lib/kafka/data
        healthcheck:
            test: kafka-metadata-quorum --bootstrap-controller controller-A1:19093 describe --status >/dev/null 2>&1
            interval: 15s
            retries: 3
        environment:
            KAFKA_NODE_ID: 9991
            CLUSTER_ID: Nk018hRAQFytWskYqtQduw
            KAFKA_PROCESS_ROLES: controller
            KAFKA_LISTENERS: CONTROLLER://controller-A1:19093
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,DOCKER:PLAINTEXT
            KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
            KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
            KAFKA_CONTROLLER_QUORUM_VOTERS: 9991@controller-A1:19093
            KAFKA_JMX_PORT: 9999
            KAFKA_JMX_HOSTNAME: controller-A1
            KAFKA_BROKER_RACK: rack-0
            KAFKA_DEFAULT_REPLICATION_FACTOR: 3
            KAFKA_OFFSET_REPLICATION_FACTOR: 3
            KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
            KAFKA_CONFLUENT_LICENSE_TOPIC_REPLICATION_FACTOR: 3
            KAFKA_CONFLUENT_METADATA_TOPIC_REPLICATION_FACTOR: 3
            KAFKA_CONFLUENT_BALANCER_TOPIC_REPLICATION_FACTOR: 3
            # KAFKA_METRIC_REPORTERS: io.confluent.metrics.reporter.ConfluentMetricsReporter
            # KAFKA_CONFLUENT_METRICS_REPORTER_BOOTSTRAP_SERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
            KAFKA_CONFLUENT_BALANCER_ENABLE: false
            # KAFKA_GROUP_COORDINATOR_REBALANCE_PROTOCOLS: classic,consumer
            # KAFKA_TRANSACTION_PARTITION_VERIFICATION_ENABLE: false

        cap_add:
            - NET_ADMIN
        ports:
            - "19093:19093"

    kafka-A1:
        image: confluentinc/cp-server:7.8.1
        hostname: kafka-A1
        container_name: kafka-A1
        volumes:
            - data-kafka-A1:/var/lib/kafka/data
        healthcheck:
            test: nc -z kafka-A1 9092
            interval: 15s
            retries: 3
        depends_on:
            controller-A1:
                condition: service_healthy
        environment:
            KAFKA_LISTENERS: DOCKER://kafka-A1:9092, EXTERNAL://kafka-A1:19092
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,DOCKER:PLAINTEXT,EXTERNAL:PLAINTEXT
            KAFKA_ADVERTISED_LISTENERS: DOCKER://kafka-A1:9092, EXTERNAL://localhost:19092
            KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
            KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
            KAFKA_JMX_PORT: 10001
            KAFKA_JMX_HOSTNAME: localhost
            KAFKA_BROKER_RACK: rack-0
            KAFKA_METRIC_REPORTERS: io.confluent.metrics.reporter.ConfluentMetricsReporter
            KAFKA_NODE_ID: 1
            CLUSTER_ID: Nk018hRAQFytWskYqtQduw
            KAFKA_CONTROLLER_QUORUM_VOTERS: 9991@controller-A1:19093
            KAFKA_PROCESS_ROLES: broker
            KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
            KAFKA_CONFLUENT_METRICS_REPORTER_BOOTSTRAP_SERVERS: kafka-A1:9092,kafka-A2:9092,kafka-A3:9092
            KAFKA_CONFLUENT_BALANCER_ENABLE: false
            # KAFKA_GROUP_COORDINATOR_REBALANCE_PROTOCOLS: classic,consumer
            # KAFKA_TRANSACTION_PARTITION_VERIFICATION_ENABLE: false
        cap_add:
            - NET_ADMIN
        ports:
            - "19092:19092"
            - "10001:10001"

    kafka-A2:
        image: confluentinc/cp-server:7.8.1
        hostname: kafka-A2
        container_name: kafka-A2
        volumes:
            - data-kafka-A2:/var/lib/kafka/data
        healthcheck:
