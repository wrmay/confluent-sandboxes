        restart: always
        hostname: tools
        container_name: tools
        volumes:
            - ${PWD}:/apps
        environment:
            CLASSPATH: "/usr/share/java/monitoring-interceptors/monitoring-interceptors-7.5.3.jar"
        working_dir: /apps
        command: /bin/bash
        tty: true
        profiles:
        - inactive



